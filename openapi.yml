openapi: "3.0.3"
info:
  title: Reader API
  version: "1.0.0"
  description: REST API for a manga/comic reader platform.

servers:
  - url: http://localhost:8080/api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Config:
      type: object
      properties:
        cdn_url:           { type: string }
        register_disabled: { type: boolean }
        login_disabled:    { type: boolean }
        maintenance:       { type: boolean }

    User:
      type: object
      properties:
        id:          { type: integer }
        email:       { type: string, format: email }
        name:        { type: string }
        bio:         { type: string }
        avatar:      { $ref: "#/components/schemas/S3Object" }
        role:        { type: string, enum: [reader, uploader, moderator, admin] }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
        comment_suspended_until: { type: string, format: date-time, nullable: true }

    Series:
      type: object
      properties:
        id:          { type: integer }
        title:       { type: string }
        slug:        { type: string }
        description: { type: string }
        cover_image: { $ref: "#/components/schemas/S3Object" }
        author:      { type: string }
        artist:      { type: string }
        status:      { type: string, enum: [ongoing, completed, hiatus] }
        chapters:
          type: array
          items: { $ref: "#/components/schemas/Chapter" }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    Chapter:
      type: object
      properties:
        id:          { type: integer }
        series_id:   { type: integer }
        uploader_id: { type: integer, nullable: true }
        number:      { type: number }
        title:       { type: string }
        pages:
          type: array
          items: { $ref: "#/components/schemas/S3Object" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    S3Object:
      type: object
      properties:
        id:          { type: integer }
        chapter_id:  { type: integer, nullable: true }
        bucket:      { type: string }
        key:         { type: string }
        page_number: { type: integer }
        created_at:  { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id:          { type: integer }
        chapter_id:  { type: integer }
        chapter:     { $ref: "#/components/schemas/Chapter" }
        user_id:     { type: integer }
        user:        { $ref: "#/components/schemas/User" }
        body:        { type: string }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    Favorite:
      type: object
      properties:
        id:                   { type: integer }
        user_id:               { type: integer }
        series_id:             { type: integer }
        series:                { $ref: "#/components/schemas/Series" }
        last_read_chapter_id:  { type: integer, nullable: true }
        last_read_chapter:     { $ref: "#/components/schemas/Chapter" }
        created_at:            { type: string, format: date-time }
        updated_at:            { type: string, format: date-time }

    Error:
      type: object
      properties:
        error: { type: string }

paths:
  /config:
    get:
      summary: Get system configuration
      tags: [System]
      responses:
        "200":
          description: Configuration settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }

  /auth/register:
    post:
      summary: Register a new user
      description: Rate limited to 10 requests/minute per client IP. Returns 403 if REGISTER_DISABLED is set.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
                name:     { type: string }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Bad request }
        "500": { description: Internal server error }

  /auth/login:
    post:
      summary: Login and receive a JWT
      description: Rate limited to 10 requests/minute per client IP. Returns 403 if LOGIN_DISABLED is set.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:  { $ref: "#/components/schemas/User" }
        "401": { description: Invalid credentials }

  /users:
    get:
      summary: List all users (Admin only)
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: after
          in: query
          schema: { type: integer }
        - name: before
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { description: Unauthorized }

  /users/{id}:
    get:
      summary: Get user by ID (Admin only)
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Unauthorized }
        "404": { description: User not found }
    delete:
      summary: Delete user (Admin only)
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: User deleted }
        "401": { description: Unauthorized }

  /users/{id}/role:
    patch:
      summary: Update user role (Admin only)
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [reader, uploader, moderator, admin] }
      responses:
        "204": { description: Role updated }
        "401": { description: Unauthorized }

  /users/{id}/comment-suspension:
    patch:
      summary: Suspend or clear a user's commenting permission (Moderator+)
      description: Not gated behind list-users access — moderators can moderate comments without user:list. duration accepts presets ("1h", "1d", "1y"), a custom Go duration string (e.g. "72h30m"), or "" / "none" to clear an existing suspension.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duration: { type: string, example: "1d" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Invalid duration }
        "401": { description: Unauthorized }
        "403": { description: Forbidden — missing comment:suspend permission }

  /users/me/password:
    patch:
      summary: Change your own password
      description: Any authenticated user, not admin-gated — acts on the caller's own account only. Rotates the session id server-side, invalidating all existing tokens (including the one making this request).
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password:     { type: string }
      responses:
        "204": { description: Password changed }
        "400": { description: Current password incorrect, or new_password missing }
        "401": { description: Unauthorized }

  /users/me/email:
    patch:
      summary: Change your own email
      description: Requires the current password since email doubles as the login credential. Rotates the session id server-side, invalidating all existing tokens (including the one making this request), same as /users/me/password.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_email]
              properties:
                current_password: { type: string }
                new_email:        { type: string, format: email }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Current password incorrect, new_email missing, or email already in use }
        "401": { description: Unauthorized }

  /users/me/profile:
    patch:
      summary: Update your own display name and bio
      description: Self-service, same as /users/me/password — acts only on the caller's own account.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                bio:  { type: string }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: name is required }
        "401": { description: Unauthorized }

  /users/me/avatar:
    patch:
      summary: Set your own profile picture
      description: Body is a key/bucket pair from a prior POST /upload/presign upload, same pattern as series cover images.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, bucket]
              properties:
                key:    { type: string }
                bucket: { type: string }
      responses:
        "200":
          description: Updated user with new avatar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: key and bucket are required }
        "401": { description: Unauthorized }
    delete:
      summary: Remove your own profile picture
      description: Back to the initial-letter placeholder. Leaves the old S3 object for the admin S3 cleanup tool to catch, same as replacing a series cover.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Updated user with avatar cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Unauthorized }

  /users/me/comments:
    get:
      summary: List your own comments, newest first
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Page of your comments plus total matching count
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
                  total: { type: integer }
        "401": { description: Unauthorized }

  /favorites:
    get:
      summary: List your favorited series
      description: Each favorite includes its series (with cover) and last-read-chapter progress.
      tags: [Favorites]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Page of favorites plus total matching count
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Favorite" }
                  total: { type: integer }
        "401": { description: Unauthorized }
    post:
      summary: Favorite a series
      description: Idempotent — favoriting an already-favorited series returns the existing favorite instead of erroring.
      tags: [Favorites]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [series_id]
              properties:
                series_id: { type: integer }
      responses:
        "201":
          description: Favorite created (or already existed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorite" }
        "400": { description: series_id is required }
        "401": { description: Unauthorized }

  /favorites/{seriesId}:
    delete:
      summary: Unfavorite a series
      tags: [Favorites]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Favorite removed }
        "401": { description: Unauthorized }

  /favorites/{seriesId}/progress:
    patch:
      summary: Update last-read-chapter progress for a favorited series
      description: Best-effort — silently no-ops (204) if the series isn't favorited, so the frontend can call this on every chapter view without checking favorite status first.
      tags: [Favorites]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chapter_id]
              properties:
                chapter_id: { type: integer }
      responses:
        "204": { description: Progress updated (or silently no-op) }
        "400": { description: chapter_id is required }
        "401": { description: Unauthorized }

  /admin/s3/orphaned:
    get:
      summary: List orphaned S3 objects (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of orphaned objects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/S3Object" }
    delete:
      summary: Purge orphaned S3 objects (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Purge results
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: array, items: { type: string } }
                  failed: { type: array, items: { type: string } }

  /upload/presign:
    post:
      summary: Generate a presigned S3 upload URL
      tags: [Upload]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, prefix]
              properties:
                filename: { type: string }
                prefix: { type: string, description: "Storage prefix (e.g. 'covers', 'chapters/1')" }
      responses:
        "200":
          description: Presigned URL and key
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url: { type: string }
                  key: { type: string }
                  public_url: { type: string }
                  bucket: { type: string }

  /series:
    get:
      summary: List series
      description: Paginated and optionally filtered by title.
      tags: [Series]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 24 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: q
          in: query
          description: Case-insensitive title search
          schema: { type: string }
      responses:
        "200":
          description: Page of series plus total matching count
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Series" }
                  total: { type: integer }
    post:
      summary: Create a new series (Moderator only)
      tags: [Series]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, slug]
              properties:
                title:       { type: string }
                slug:        { type: string }
                description: { type: string }
                cover_key:   { type: string }
                cover_bucket: { type: string }
                author:      { type: string }
                artist:      { type: string }
                status:      { type: string, enum: [ongoing, completed, hiatus] }
      responses:
        "201":
          description: Series created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "401": { description: Unauthorized }

  /series/{id}:
    get:
      summary: Get series details by ID
      tags: [Series]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Series details with chapter list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "404": { description: Series not found }
    put:
      summary: Update series metadata (Moderator only)
      description: Full replace, same fields as create. Omit cover_key/cover_bucket to keep the existing cover image.
      tags: [Series]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, slug]
              properties:
                title:        { type: string }
                slug:         { type: string }
                description:  { type: string }
                cover_key:    { type: string }
                cover_bucket: { type: string }
                author:       { type: string }
                artist:       { type: string }
                status:       { type: string, enum: [ongoing, completed, hiatus] }
      responses:
        "200":
          description: Series updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "401": { description: Unauthorized }
    delete:
      summary: Delete series (Moderator only)
      tags: [Series]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Series deleted }
        "401": { description: Unauthorized }

  /chapters:
    post:
      summary: Create a new chapter (Uploader+)
      tags: [Chapters]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [series_id, number]
              properties:
                series_id: { type: integer }
                number:    { type: number }
                title:     { type: string }
      responses:
        "201":
          description: Chapter created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }

  /chapters/{id}:
    get:
      summary: Get chapter details by ID
      tags: [Chapters]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Chapter details with pages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        "404": { description: Chapter not found }
    put:
      summary: Update chapter number/title (Moderator+, or Uploader if own)
      tags: [Chapters]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number: { type: number }
                title:  { type: string }
      responses:
        "200":
          description: Chapter updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        "401": { description: Unauthorized }
        "403": { description: Forbidden — not the uploader and no blanket chapter:update permission }
        "404": { description: Chapter not found }
    delete:
      summary: Delete chapter (Moderator+, or Uploader if own)
      tags: [Chapters]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Chapter deleted }
        "401": { description: Unauthorized }
        "403": { description: Forbidden — not the uploader and no blanket chapter:delete permission }

  /chapters/{id}/pages:
    post:
      summary: Bulk upload pages to a chapter (Uploader+)
      tags: [Chapters]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pages]
              properties:
                pages:
                  type: array
                  items:
                    type: object
                    required: [key, bucket, page_number]
                    properties:
                      key: { type: string }
                      bucket: { type: string }
                      page_number: { type: integer }
      responses:
        "201": { description: Pages added }
        "401": { description: Unauthorized }
    put:
      summary: Reorder pages within a chapter (Moderator+, or Uploader if own)
      description: Bulk-sets page_number for the given page ids. Ids not belonging to this chapter are silently ignored.
      tags: [Chapters]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pages]
              properties:
                pages:
                  type: array
                  items:
                    type: object
                    required: [id, page_number]
                    properties:
                      id:          { type: integer }
                      page_number: { type: integer }
      responses:
        "204": { description: Page order updated }
        "401": { description: Unauthorized }
        "403": { description: Forbidden — not the uploader and no blanket chapter:update permission }

  /chapters/{id}/pages/{pageId}:
    delete:
      summary: Delete a page from a chapter (Moderator+, or Uploader if own)
      tags: [Chapters]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: pageId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Page deleted }
        "401": { description: Unauthorized }
        "403": { description: Forbidden — not the uploader and no blanket chapter:update permission }

  /chapters/{id}/comments:
    get:
      summary: List comments on a chapter
      tags: [Comments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Page of comments plus total matching count
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
                  total: { type: integer }
    post:
      summary: Post a comment on a chapter
      description: Requires comment:create (granted to every role by default) and no active commenting suspension.
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { description: Empty body, forbidden, or commenting suspended }
        "401": { description: Unauthorized }

  /comments/{id}:
    delete:
      summary: Delete a comment (author, or Moderator+)
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Comment deleted }
        "401": { description: Unauthorized }
        "403": { description: Forbidden — not the author and no comment:delete permission }
        "404": { description: Comment not found }

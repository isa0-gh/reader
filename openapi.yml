openapi: "3.0.3"
info:
  title: Reader API
  version: "1.0.0"
  description: REST API for a manga/comic reader platform.

servers:
  - url: http://localhost:8080/api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:          { type: integer }
        email:       { type: string, format: email }
        name:        { type: string }
        role:        { type: string, enum: [reader, uploader, moderator, admin] }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    Series:
      type: object
      properties:
        id:          { type: integer }
        title:       { type: string }
        slug:        { type: string }
        description: { type: string }
        cover_image: { type: string }
        author:      { type: string }
        artist:      { type: string }
        status:      { type: string, enum: [ongoing, completed, hiatus] }
        chapters:
          type: array
          items: { $ref: "#/components/schemas/Chapter" }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    Chapter:
      type: object
      properties:
        id:         { type: integer }
        series_id:  { type: integer }
        number:     { type: number }
        title:      { type: string }
        pages:
          type: array
          items: { $ref: "#/components/schemas/S3Object" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    S3Object:
      type: object
      properties:
        id:          { type: integer }
        chapter_id:  { type: integer }
        bucket:      { type: string }
        key:         { type: string }
        page_number: { type: integer }
        created_at:  { type: string, format: date-time }

    Error:
      type: object
      properties:
        message: { type: string }

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
                name:     { type: string }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Bad request }
        "500": { description: Internal server error }

  /auth/login:
    post:
      summary: Login and receive a JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:  { $ref: "#/components/schemas/User" }
        "401": { description: Invalid credentials }

  /series/{id}:
    get:
      summary: Get series details by ID
      tags: [Series]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Series details with chapter list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "404": { description: Series not found }

  /chapters/{id}:
    get:
      summary: Get chapter details by ID
      tags: [Chapters]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Chapter details with pages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        "404": { description: Chapter not found }

  /users:
    get:
      summary: List all users
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { description: Unauthorized }

  /users/{id}:
    get:
      summary: Get user by ID
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Unauthorized }
        "404": { description: User not found }

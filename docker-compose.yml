services:
  db:
    image: postgres:16-alpine
    container_name: reader-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-reader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reader}
      POSTGRES_DB: ${DB_NAME:-reader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reader} -d ${DB_NAME:-reader}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reader-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-reader}
      - DB_PASSWORD=${DB_PASSWORD:-reader}
      - DB_NAME=${DB_NAME:-reader}
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - PORT=${PORT:-8080}
      - DEBUG=${DEBUG:-true}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_PATH_STYLE=${S3_USE_PATH_STYLE}
      - CDN_URL_PREFIX=${CDN_URL_PREFIX}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reader-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
